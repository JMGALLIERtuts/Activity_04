<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SneakerNest Business Card</title>


  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">


  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="cards-wrapper">

    <div class="card card-front">
      <div class="panel-left">
        <img src="assets/logo.png" alt="SneakerNest Logo" class="logo">
        <h1 class="brand-title">SneakerNest</h1>
        <p class="tagline">Rare Finds. Everyday flex.</p>
      </div>

      <div class="icon-strip">
        <img src="assets/icon-phone.svg" >
        <img src="assets/icon-email.svg" >
        <img src="assets/icon-browser.svg" >
        <img src="assets/icon-location.svg" >
      </div>

      <div class="panel-right">
        <div class="top-arc">
          <h2 class="person-name">Jose Marie L. Gallier</h2>
          <span class="person-title">Owner</span>
        </div>

        <div class="contact-details">
          <p class="contact-item">+63 935 594 6420</p>
          <p class="contact-item"><a href="mailto:sneakernest@gmail.com">sneakernest@gmail.com</a></p>
          <p class="contact-item"><a href="http://www.sneakernest.com" target="_blank">www.sneakernest.com</a></p>
          <p class="contact-item address">
            Poblacion, Lupon, Davao Oriental,<br>
            Philippines, 8207.
          </p>
        </div>

        <div class="red-line"></div>
      </div>
    </div>

    <div class="card card-back">
      <div class="back-content">
        <img src="assets/logo.png" alt="SneakerNest Logo" class="logo-large">
        <h1 class="brand-title">SneakerNest</h1>
        <p class="tagline">Rare Finds. Everyday Flex.</p>
      </div>

      <div class="bottom-bars">
        <div class="bar-red"></div>
        <div class="bar-blue"></div>
      </div>
    </div>

  </main>

</body>
</html>
